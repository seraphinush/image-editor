<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f4f1" />
    <title>Image Editor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <script src="app.js"></script>
    <script type="module">
      try {
        if (!Object.hasOwn(HTMLElement.prototype, "popover")) {
          await import("https://unpkg.com/@oddbird/popover-polyfill@latest/dist/popover.min.js");
        }
        if (!("commandForElement" in HTMLButtonElement.prototype)) {
          await import("https://esm.run/invokers-polyfill");
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="design.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="brand">
        <span class="brand-logo"><span class="material-symbols outlined" aria-hidden="true">image</span></span
        ><span class="brand-name">Image Editor</span><small class="brand-author">by seraphh</small>
      </h1>
      <div class="header-actions">
        <button class="button icon-only" id="clearBtn" type="button" title="New" aria-label="New" disabled>
          <span class="material-symbols outlined" aria-hidden="true">draft</span>
        </button>
        <div></div>
        <button class="button icon-only" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo (Ctrl+Z)" disabled>
          <span class="material-symbols outlined" aria-hidden="true">undo</span></button
        ><button class="button icon-only" id="redoBtn" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo (Ctrl+Shift+Z)" disabled>
          <span class="material-symbols outlined" aria-hidden="true">redo</span></button
        ><button class="button icon-only primary" id="copyBtn" type="button" title="Copy (Ctrl+C)" aria-label="Copy (Ctrl+C)">
          <span class="material-symbols outlined" aria-hidden="true">content_copy</span></button
        ><button class="button icon-only" id="downloadBtn" type="button" title="Download PNG" aria-label="Download PNG">
          <span class="material-symbols outlined" aria-hidden="true">download</span>
        </button>
        <div></div>
        <div class="theme-toggle" role="group" aria-label="Color theme"></div>
      </div>
    </header>
    <nav class="toolbar" aria-label="Image tools">
      <div class="toolbar-scroller">
        <div class="tool-group is-selected" data-tool-panel="frame" role="group" aria-label="Frame">
          <div class="tool-subgroup" role="group" aria-label="Canvas size">
            <button class="button icon-only" id="fitImageBtn" type="button" title="Fit canvas to image (F)" aria-label="Fit canvas to image (F)">
              <span class="material-symbols outlined" aria-hidden="true">zoom_out_map</span>
            </button>
            <input id="canvasW" type="number" min="1" value="500" aria-label="Canvas width" /><span class="unit">px</span>
            <button class="button icon-only" id="lockBtn" type="button" title="Unlock aspect ratio" aria-label="Unlock aspect ratio">
              <span class="material-symbols outlined" aria-hidden="true">lock</span>
            </button>
            <input id="canvasH" type="number" min="1" value="500" aria-label="Canvas height" /><span class="unit">px</span>
            <button class="button icon-only" id="resizeBtn" type="button" title="Apply canvas size" aria-label="Apply canvas size">
              <span class="material-symbols outlined" aria-hidden="true">check</span>
            </button>
          </div>
          <div class="tool-subgroup" role="group" aria-label="Canvas ratio">
            <button
              class="button menu-trigger ratio-trigger"
              id="ratioBtn"
              type="button"
              title="Canvas ratio 1:1"
              aria-label="Canvas ratio 1:1"
              aria-haspopup="menu"
              aria-expanded="false"
              commandfor="ratioMenu"
              command="toggle-popover"
            >
              <span id="ratioCurrent">1:1</span>
            </button>
            <div id="ratioMenu" popover="auto" class="tool-menu">
              <div focusgroup="menu nomemory" aria-labelledby="ratioBtn">
                <div role="group" aria-label="Canvas ratios">
                  <button type="button" class="ratio-preset" role="menuitemradio" aria-checked="true" data-ratio-w="1" data-ratio-h="1" title="Crop the canvas to 1:1 around the image">
                    1:1
                  </button>
                  <button type="button" class="ratio-preset" role="menuitemradio" aria-checked="false" data-ratio-w="3" data-ratio-h="4" title="Crop the canvas to 3:4 around the image">
                    3:4
                  </button>
                  <button type="button" class="ratio-preset" role="menuitemradio" aria-checked="false" data-ratio-w="9" data-ratio-h="16" title="Crop the canvas to 9:16 around the image">
                    9:16
                  </button>
                </div>
              </div>
            </div>
            <button class="button icon-only" id="invertRatioBtn" type="button" title="Invert aspect ratio" aria-label="Invert aspect ratio">
              <span class="material-symbols outlined flip-vertical" aria-hidden="true">sync</span>
            </button>
          </div>
          <div class="tool-subgroup" role="group" aria-label="Scale">
            <input id="scaleValue" type="number" min="1" value="100" aria-label="Scale value" />
            <div class="scale-toggle" role="group" aria-label="Scale unit">
              <button class="button" id="scalePercent" type="button" aria-pressed="true" title="Scale by percent" aria-label="Scale by percent">%</button>
              <button class="button" id="scalePixels" type="button" aria-pressed="false" title="Scale by pixel width" aria-label="Scale by pixel width">px</button>
            </div>
            <button class="button icon-only" id="scaleBtn" type="button" title="Apply scale" aria-label="Apply scale">
              <span class="material-symbols outlined" aria-hidden="true">check</span>
            </button>
          </div>
          <div class="tool-subgroup" role="group" aria-label="Crop">
            <input id="cropAmount" type="number" min="0" value="0" aria-label="Crop amount in pixels" title="Crop amount (C)" /><span class="unit">px</span>
            <button class="button icon-only" type="button" data-crop="left" title="Crop from left" aria-label="Crop from left">
              <span class="material-symbols outlined" aria-hidden="true">arrow_back</span>
            </button>
            <button class="button icon-only" type="button" data-crop="right" title="Crop from right" aria-label="Crop from right">
              <span class="material-symbols outlined" aria-hidden="true">arrow_forward</span>
            </button>
            <button class="button icon-only" type="button" data-crop="top" title="Crop from top" aria-label="Crop from top">
              <span class="material-symbols outlined" aria-hidden="true">arrow_upward</span>
            </button>
            <button class="button icon-only" type="button" data-crop="bottom" title="Crop from bottom" aria-label="Crop from bottom">
              <span class="material-symbols outlined" aria-hidden="true">arrow_downward</span>
            </button>
          </div>
        </div>
        <div class="tool-group" data-tool-panel="layout" role="group" aria-label="Layout">
          <button class="button icon-only" id="handBtn" type="button" title="Hand tool (H)" aria-label="Hand tool (H)" aria-pressed="true">
            <span class="material-symbols outlined" aria-hidden="true">pan_tool</span>
          </button>
          <button class="button icon-only" id="layoutGridBtn" type="button" title="Place image on the canvas (V)" aria-label="Place image on the canvas (V)" aria-pressed="false">
            <span class="material-symbols outlined" aria-hidden="true">grid_on</span>
          </button>
        </div>
        <div class="tool-group" data-tool-panel="transform" role="group" aria-label="Transform">
          <div class="tool-subgroup" role="group" aria-label="Rotate">
            <button class="button icon-only" id="rotateLeftBtn" type="button" title="Rotate left" aria-label="Rotate left">
              <span class="material-symbols outlined" aria-hidden="true">rotate_left</span>
            </button>
            <button class="button icon-only" id="rotateRightBtn" type="button" title="Rotate right" aria-label="Rotate right">
              <span class="material-symbols outlined" aria-hidden="true">rotate_right</span>
            </button>
          </div>
          <div class="tool-subgroup" role="group" aria-label="Flip">
            <button class="button icon-only" id="flipHBtn" type="button" title="Flip horizontal" aria-label="Flip horizontal">
              <span class="material-symbols outlined" aria-hidden="true">flip</span>
            </button>
            <button class="button icon-only" id="flipVBtn" type="button" title="Flip vertical" aria-label="Flip vertical">
              <span class="material-symbols outlined flip-vertical" aria-hidden="true">flip</span>
            </button>
          </div>
        </div>
        <div class="tool-group" data-tool-panel="automation" role="group" aria-label="Automation">
          <div class="tool-subgroup" role="group" aria-label="Record and save">
            <button
              class="button icon-only"
              id="recordSeries"
              type="button"
              title="Start recording a transformation series"
              aria-label="Start recording a transformation series"
              aria-pressed="false"
            >
              <span class="material-symbols outlined" aria-hidden="true">radio_button_checked</span>
            </button>
            <button class="button icon-only" id="saveSeries" type="button" title="Save series as template" aria-label="Save series as template">
              <span class="material-symbols outlined" aria-hidden="true">save</span>
            </button>
          </div>
          <div class="tool-subgroup" role="group" aria-label="Apply template">
            <select id="templateSelect" class="select" aria-label="Saved transformation templates">
              <option value="">Choose template</option>
            </select>
            <button class="button icon-only" id="applySeries" type="button" title="Apply template to selected images" aria-label="Apply template to selected images">
              <span class="material-symbols outlined" aria-hidden="true">play_arrow</span>
            </button>
            <button class="button icon-only" id="deleteTemplate" type="button" title="Delete selected template" aria-label="Delete selected template">
              <span class="material-symbols outlined" aria-hidden="true">delete</span>
            </button>
          </div>
        </div>
      </div>
    </nav>
    <div class="tool-dock" aria-label="Tool groups">
      <button class="button dock-btn" type="button" data-dock="frame" aria-pressed="true" aria-label="Frame (1)" title="Frame (1)">
        <span class="material-symbols outlined" aria-hidden="true">crop_free</span>
      </button>
      <button class="button dock-btn" type="button" data-dock="layout" aria-pressed="false" aria-label="Layout (2)" title="Layout (2)">
        <span class="material-symbols outlined" aria-hidden="true">grid_on</span>
      </button>
      <button class="button dock-btn" type="button" data-dock="transform" aria-pressed="false" aria-label="Transform (3)" title="Transform (3)">
        <span class="material-symbols outlined" aria-hidden="true">flip</span>
      </button>
      <button class="button dock-btn" type="button" data-dock="automation" aria-pressed="false" aria-label="Automation and templates (4)" title="Automation and templates (4)">
        <span class="material-symbols outlined" aria-hidden="true">automation</span>
      </button>
    </div>
    <main class="stage" id="stage">
      <canvas class="stage-overflow" id="overflowCanvas" aria-hidden="true"></canvas>
      <div class="canvas-frame">
        <canvas id="canvas" width="500" height="500" draggable="false"></canvas><span class="resize-handle" data-corner="nw" aria-hidden="true"></span
        ><span class="resize-handle" data-corner="ne" aria-hidden="true"></span><span class="resize-handle" data-corner="sw" aria-hidden="true"></span
        ><span class="resize-handle" data-corner="se" aria-hidden="true"></span>
        <div id="layoutOverlay" class="layout-overlay" hidden>
          <div class="layout-grid" role="group" aria-label="Place image on the canvas">
            <button type="button" data-place-col="0" data-place-row="0" aria-label="Top left"></button>
            <button type="button" data-place-col="1" data-place-row="0" aria-label="Top center"></button>
            <button type="button" data-place-col="2" data-place-row="0" aria-label="Top right"></button>
            <button type="button" data-place-col="0" data-place-row="1" aria-label="Middle left"></button>
            <button type="button" data-place-col="1" data-place-row="1" aria-label="Center"></button>
            <button type="button" data-place-col="2" data-place-row="1" aria-label="Middle right"></button>
            <button type="button" data-place-col="0" data-place-row="2" aria-label="Bottom left"></button>
            <button type="button" data-place-col="1" data-place-row="2" aria-label="Bottom center"></button>
            <button type="button" data-place-col="2" data-place-row="2" aria-label="Bottom right"></button>
          </div>
        </div>
      </div>
      <div class="empty-state" id="empty">
        <section class="empty-state-card" aria-labelledby="emptyTitle">
          <h2 id="emptyTitle">Your image workspace</h2>
          <p>Drop images here, paste from your clipboard, or add files to get started.</p>
          <button class="button primary" id="emptyOpen" type="button">
            <span class="material-symbols outlined" aria-hidden="true">add</span><span>Choose images</span>
          </button>
          <p class="empty-state-hint">PNG · JPG · GIF · WebP · Ctrl/⌘+V to paste</p>
        </section>
      </div>
    </main>
    <aside class="images-panel" id="imagesPanel" aria-labelledby="imagesTitle">
      <header class="images-panel-header">
        <h2 class="images-panel-title" id="imagesTitle">Images</h2>
        <span class="image-count" id="count">0</span
        ><button class="button icon-only" id="openBtn" type="button" title="Add images (Ctrl+O)" aria-label="Add images (Ctrl+O)">
          <span class="material-symbols outlined" aria-hidden="true">add</span>
        </button>
        <div class="images-panel-actions">
          <button class="button icon-only" id="selectAll" type="button" title="Select all" aria-label="Select all">
            <span class="material-symbols outlined" aria-hidden="true">select_all</span>
          </button>
          <button class="button icon-only" id="duplicateBtn" type="button" title="Duplicate selected images" aria-label="Duplicate selected images">
            <span class="material-symbols outlined" aria-hidden="true">file_copy</span>
          </button>
          <hr class="divider" aria-orientation="vertical" />
          <button class="button icon-only" id="mergeH" type="button" title="Merge horizontally" aria-label="Merge horizontally">
            <span class="material-symbols outlined" aria-hidden="true">arrow_forward</span></button
          ><button class="button icon-only" id="mergeV" type="button" title="Merge vertically" aria-label="Merge vertically">
            <span class="material-symbols outlined" aria-hidden="true">arrow_downward</span>
          </button>
        </div>
        <button id="toggleImages" type="button" aria-label="Collapse images panel" aria-expanded="true" aria-controls="layers" title="Collapse images panel">
          <span class="material-symbols outlined" aria-hidden="true">chevron_right</span>
        </button>
      </header>
      <ul class="image-list" id="layers">
        <li class="image-list-empty">Pasted and added images will appear here.</li>
      </ul>
    </aside>
    <div class="toast" id="status" role="status"></div>
    <dialog class="confirm" id="confirm" aria-labelledby="confirmTitle" closedby="any">
      <h2 id="confirmTitle"></h2>
      <p id="confirmMessage"></p>
      <div class="confirm-actions" id="confirmActions">
        <button class="button" id="confirmYes" type="button">Yes</button>
        <button class="button" id="confirmNo" type="button">No</button>
      </div>
    </dialog>
    <input type="file" id="fileInput" accept="image/*" multiple hidden />
  </body>
</html>
